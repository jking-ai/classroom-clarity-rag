<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 960" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#5ba0e6"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="shadowSm" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4a90d9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#34d399"/>
    </marker>
    <marker id="arrowGreenBack" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f87171"/>
    </marker>
    <marker id="arrowRedBack" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="#f87171"/>
    </marker>
    <marker id="arrowSlate" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94a3b8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="960" rx="12" fill="#0f1724"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2538" stroke-width="0.5"/>
  </pattern>
  <rect width="1100" height="960" fill="url(#grid)" opacity="0.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="1100" height="76" rx="12" fill="#141e2e"/>
  <rect x="0" y="40" width="1100" height="36" fill="#141e2e"/>
  <line x1="0" y1="76" x2="1100" y2="76" stroke="#1e2d42" stroke-width="1"/>
  <text x="550" y="38" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="600">Document Ingestion Flow</text>
  <text x="550" y="60" text-anchor="middle" fill="#64748b" font-size="12">How school documents become searchable knowledge</text>

  <!-- Actor lanes (lifelines) -->
  <!-- Client -->
  <rect x="60" y="96" width="120" height="42" rx="21" fill="#1e2d42" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadowSm)"/>
  <text x="120" y="122" text-anchor="middle" fill="#4a90d9" font-size="13" font-weight="600">Client</text>
  <line x1="120" y1="138" x2="120" y2="900" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.2"/>

  <!-- Spring Boot API -->
  <rect x="258" y="96" width="144" height="42" rx="21" fill="#1e2d42" stroke="#34d399" stroke-width="1.5" filter="url(#shadowSm)"/>
  <text x="330" y="122" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600">Spring Boot API</text>
  <line x1="330" y1="138" x2="330" y2="900" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.2"/>

  <!-- File Storage -->
  <rect x="462" y="96" width="126" height="42" rx="21" fill="#1e2d42" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowSm)"/>
  <text x="525" y="122" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600">File Storage</text>
  <line x1="525" y1="138" x2="525" y2="900" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.2"/>

  <!-- Vertex AI -->
  <rect x="662" y="96" width="126" height="42" rx="21" fill="#1e2d42" stroke="#f87171" stroke-width="1.5" filter="url(#shadowSm)"/>
  <text x="725" y="122" text-anchor="middle" fill="#f87171" font-size="13" font-weight="600">Vertex AI</text>
  <line x1="725" y1="138" x2="725" y2="900" stroke="#f87171" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.2"/>

  <!-- PostgreSQL -->
  <rect x="860" y="96" width="180" height="42" rx="21" fill="#1e2d42" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadowSm)"/>
  <text x="950" y="122" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="600">PostgreSQL + pgvector</text>
  <line x1="950" y1="138" x2="950" y2="900" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.2"/>

  <!-- Step 1: Upload PDF -->
  <g>
    <rect x="30" y="160" width="1040" height="80" rx="8" fill="#172033" stroke="#1e2d42" stroke-width="1"/>
    <circle cx="52" cy="180" r="12" fill="#4a90d9"/>
    <text x="52" y="185" text-anchor="middle" fill="#0f1724" font-size="11" font-weight="700">1</text>
    <text x="72" y="185" fill="#4a90d9" font-size="12" font-weight="600">Upload PDF</text>

    <line x1="140" y1="205" x2="310" y2="205" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <rect x="155" y="191" width="125" height="24" rx="4" fill="#1e2d42" stroke="#2a3a52" stroke-width="0.5"/>
    <text x="217" y="207" text-anchor="middle" fill="#cbd5e1" font-size="10">POST /api/v1/documents</text>
    <text x="217" y="230" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">multipart/form-data (PDF)</text>
  </g>

  <!-- Step 2: Create DB record -->
  <g>
    <rect x="30" y="250" width="1040" height="80" rx="8" fill="#172033" stroke="#1e2d42" stroke-width="1"/>
    <circle cx="52" cy="270" r="12" fill="#34d399"/>
    <text x="52" y="275" text-anchor="middle" fill="#0f1724" font-size="11" font-weight="700">2</text>
    <text x="72" y="275" fill="#34d399" font-size="12" font-weight="600">Create Document Record</text>

    <line x1="350" y1="295" x2="930" y2="295" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="520" y="281" width="210" height="24" rx="4" fill="#1e2d42" stroke="#2a3a52" stroke-width="0.5"/>
    <text x="625" y="297" text-anchor="middle" fill="#cbd5e1" font-size="10">INSERT document (status: PROCESSING)</text>
    <text x="625" y="320" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">Committed immediately so progress is visible</text>
  </g>

  <!-- Step 3: Store file -->
  <g>
    <rect x="30" y="340" width="1040" height="80" rx="8" fill="#172033" stroke="#1e2d42" stroke-width="1"/>
    <circle cx="52" cy="360" r="12" fill="#f59e0b"/>
    <text x="52" y="365" text-anchor="middle" fill="#0f1724" font-size="11" font-weight="700">3</text>
    <text x="72" y="365" fill="#f59e0b" font-size="12" font-weight="600">Store Raw PDF</text>

    <line x1="350" y1="385" x2="505" y2="385" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <rect x="365" y="371" width="120" height="24" rx="4" fill="#1e2d42" stroke="#2a3a52" stroke-width="0.5"/>
    <text x="425" y="387" text-anchor="middle" fill="#cbd5e1" font-size="10">Save file to storage</text>
    <text x="425" y="410" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">Local disk or Cloud Storage</text>
  </g>

  <!-- Step 4: Extract text -->
  <g>
    <rect x="30" y="430" width="1040" height="80" rx="8" fill="#172033" stroke="#1e2d42" stroke-width="1"/>
    <circle cx="52" cy="450" r="12" fill="#4a90d9"/>
    <text x="52" y="455" text-anchor="middle" fill="#0f1724" font-size="11" font-weight="700">4</text>
    <text x="72" y="455" fill="#4a90d9" font-size="12" font-weight="600">Extract Text from PDF</text>

    <path d="M 345 475 C 400 475, 400 460, 345 460" stroke="#4a90d9" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
    <rect x="370" y="453" width="155" height="36" rx="4" fill="#1e2d42" stroke="#2a3a52" stroke-width="0.5"/>
    <text x="447" y="467" text-anchor="middle" fill="#cbd5e1" font-size="10">Apache PDFBox extracts</text>
    <text x="447" y="481" text-anchor="middle" fill="#cbd5e1" font-size="10">text page by page</text>
  </g>

  <!-- Step 5: Chunk text -->
  <g>
    <rect x="30" y="520" width="1040" height="80" rx="8" fill="#172033" stroke="#1e2d42" stroke-width="1"/>
    <circle cx="52" cy="540" r="12" fill="#a78bfa"/>
    <text x="52" y="545" text-anchor="middle" fill="#0f1724" font-size="11" font-weight="700">5</text>
    <text x="72" y="545" fill="#a78bfa" font-size="12" font-weight="600">Chunk Text</text>

    <path d="M 345 565 C 400 565, 400 550, 345 550" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
    <rect x="370" y="540" width="190" height="36" rx="4" fill="#1e2d42" stroke="#2a3a52" stroke-width="0.5"/>
    <text x="465" y="554" text-anchor="middle" fill="#cbd5e1" font-size="10">Sliding window: ~512 tokens</text>
    <text x="465" y="568" text-anchor="middle" fill="#cbd5e1" font-size="10">with ~100 token overlap</text>
  </g>

  <!-- Step 6: Generate embeddings -->
  <g>
    <rect x="30" y="610" width="1040" height="85" rx="8" fill="#172033" stroke="#1e2d42" stroke-width="1"/>
    <circle cx="52" cy="630" r="12" fill="#f87171"/>
    <text x="52" y="635" text-anchor="middle" fill="#0f1724" font-size="11" font-weight="700">6</text>
    <text x="72" y="635" fill="#f87171" font-size="12" font-weight="600">Generate Embeddings</text>

    <line x1="350" y1="655" x2="705" y2="655" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRed)"/>
    <rect x="420" y="641" width="185" height="24" rx="4" fill="#1e2d42" stroke="#2a3a52" stroke-width="0.5"/>
    <text x="512" y="657" text-anchor="middle" fill="#cbd5e1" font-size="10">Batch embed (25 chunks/batch)</text>

    <line x1="705" y1="672" x2="350" y2="672" stroke="#f87171" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowRedBack)"/>
    <text x="527" y="688" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">768-dim vectors (text-embedding-005)</text>
  </g>

  <!-- Step 7: Store chunks + vectors -->
  <g>
    <rect x="30" y="705" width="1040" height="80" rx="8" fill="#172033" stroke="#1e2d42" stroke-width="1"/>
    <circle cx="52" cy="725" r="12" fill="#94a3b8"/>
    <text x="52" y="730" text-anchor="middle" fill="#0f1724" font-size="11" font-weight="700">7</text>
    <text x="72" y="730" fill="#94a3b8" font-size="12" font-weight="600">Store Chunks + Vectors</text>

    <line x1="350" y1="750" x2="930" y2="750" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowSlate)"/>
    <rect x="505" y="736" width="220" height="24" rx="4" fill="#1e2d42" stroke="#2a3a52" stroke-width="0.5"/>
    <text x="615" y="752" text-anchor="middle" fill="#cbd5e1" font-size="10">INSERT chunks with embeddings (CASCADE)</text>
    <text x="615" y="775" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">HNSW-indexed for fast similarity search</text>
  </g>

  <!-- Step 8: Response -->
  <g>
    <rect x="30" y="795" width="1040" height="70" rx="8" fill="#172033" stroke="#1e2d42" stroke-width="1"/>
    <circle cx="52" cy="815" r="12" fill="#34d399"/>
    <text x="52" y="820" text-anchor="middle" fill="#0f1724" font-size="11" font-weight="700">8</text>
    <text x="72" y="820" fill="#34d399" font-size="12" font-weight="600">Return Response</text>

    <line x1="310" y1="840" x2="140" y2="840" stroke="#34d399" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowGreenBack)"/>
    <rect x="160" y="826" width="118" height="24" rx="4" fill="#1e2d42" stroke="#2a3a52" stroke-width="0.5"/>
    <text x="219" y="842" text-anchor="middle" fill="#cbd5e1" font-size="10">200 OK + document ID</text>
  </g>

  <!-- Footer -->
  <text x="550" y="910" text-anchor="middle" fill="#475569" font-size="11">Classroom Clarity RAG</text>
  <text x="550" y="930" text-anchor="middle" fill="#334155" font-size="10">Java 21 / Spring Boot / Spring AI / Vertex AI / PostgreSQL + pgvector</text>

  <!-- Tech pill badges in footer -->
  <g transform="translate(310, 940)">
    <rect width="70" height="16" rx="8" fill="#1e2d42" stroke="#4a90d9" stroke-width="0.5"/>
    <text x="35" y="12" text-anchor="middle" fill="#4a90d9" font-size="8" font-weight="500">Spring AI</text>
  </g>
  <g transform="translate(390, 940)">
    <rect width="70" height="16" rx="8" fill="#1e2d42" stroke="#f87171" stroke-width="0.5"/>
    <text x="35" y="12" text-anchor="middle" fill="#f87171" font-size="8" font-weight="500">Vertex AI</text>
  </g>
  <g transform="translate(470, 940)">
    <rect width="70" height="16" rx="8" fill="#1e2d42" stroke="#34d399" stroke-width="0.5"/>
    <text x="35" y="12" text-anchor="middle" fill="#34d399" font-size="8" font-weight="500">pgvector</text>
  </g>
  <g transform="translate(550, 940)">
    <rect width="70" height="16" rx="8" fill="#1e2d42" stroke="#a78bfa" stroke-width="0.5"/>
    <text x="35" y="12" text-anchor="middle" fill="#a78bfa" font-size="8" font-weight="500">PDFBox</text>
  </g>
  <g transform="translate(630, 940)">
    <rect width="80" height="16" rx="8" fill="#1e2d42" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="40" y="12" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="500">Cloud Storage</text>
  </g>
</svg>