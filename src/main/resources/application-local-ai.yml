spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/classroomclarity
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GCP_PROJECT_ID}
          location: ${GCP_LOCATION:us-central1}
          chat:
            options:
              model: gemini-2.0-flash
              max-output-tokens: 1024
        embedding:
          project-id: ${GCP_PROJECT_ID}
          location: ${GCP_LOCATION:us-central1}
          text:
            options:
              model: text-embedding-005

app:
  security:
    api-key: dev-local-key-changeme
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  storage:
    local:
      upload-dir: data/uploads
